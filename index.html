<style>
  @font-face { font-family: "Anton"; src: url("fuentes/Anton.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Caveat"; src: url("fuentes/Caveat-Bold.woff") format("woff"); font-weight: 700; font-display: swap; }

  :root {
    --amarillo: #e9c46a;
    --rayo: #f0d48c;
    --linea: #2b1a14;
    --guinda: #8a1f2d;
    --rojo: #e0352b;
    --verde: #1d5a27;
    --menta: #86cbb5;
    --crema: #f4efe6;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--linea);
    background-color: var(--amarillo);
    background-image: repeating-conic-gradient(from 0deg at 50% 150px,
      var(--amarillo) 0deg 7.5deg, var(--rayo) 7.5deg 15deg);
    background-attachment: fixed;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .tomate {
    display: block;
    width: 220px;
    height: auto;
    margin-bottom: -6px;
    filter: drop-shadow(0 6px 0 rgba(43, 26, 20, .18));
    transform-origin: 50% 100%;
    animation: rebote .7s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  @keyframes rebote {
    0%   { transform: translateY(-40px) scale(.9, 1.08); opacity: 0; }
    55%  { transform: translateY(0) scale(1.08, .92); opacity: 1; }
    80%  { transform: translateY(-6px) scale(.98, 1.02); }
    100% { transform: none; }
  }

  h1 {
    margin: 0;
    font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    font-weight: 400;
    line-height: .98;
    letter-spacing: .01em;
    color: #fff;
    -webkit-text-stroke: .14em var(--linea);
    paint-order: stroke fill;
    text-shadow: 0 .07em 0 var(--linea);
  }
  h1 .uno { display: block; font-size: clamp(46px, 16vw, 68px); }
  h1 .dos { display: block; font-size: clamp(33px, 11.5vw, 49px); }

  .frase {
    margin: 10px 0 6px;
    font-family: "Caveat", "Segoe Print", cursive;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    color: var(--guinda);
    transform: rotate(-2deg);
  }
  .bio {
    margin: 0 0 22px;
    max-width: 30ch;
    font-size: 16px;
    line-height: 1.45;
    font-weight: 600;
  }

  nav { width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .boton {
    --fondo: var(--crema);
    --tinta: var(--linea);
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    padding: 10px 18px;
    border: 3px solid var(--linea);
    border-radius: 16px;
    background: var(--fondo);
    color: var(--tinta);
    text-decoration: none;
    text-align: left;
    box-shadow: 0 5px 0 var(--linea);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .boton:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--linea); }
  .boton:focus-visible { outline: 3px solid var(--guinda); outline-offset: 4px; }
  @media (hover: hover) {
    .boton:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--linea); }
    .boton:hover:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--linea); }
  }
  .boton svg { flex: none; width: 30px; height: 30px; }
  .boton .nombre {
    font-family: "Anton", Impact, sans-serif;
    font-size: 22px;
    letter-spacing: .03em;
    text-transform: uppercase;
    line-height: 1;
  }
  .boton .flecha { margin-left: auto; font-size: 22px; font-weight: 700; }

  .boton.principal {
    --fondo: var(--guinda);
    --tinta: var(--crema);
  }

  footer {
    margin-top: 28px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
  }
  footer .legal {
    display: block;
    margin-top: 10px;
    font-size: 11.5px;
    font-weight: 400;
    opacity: .75;
    max-width: 36ch;
    margin-inline: auto;
  }

  @media (min-width: 700px) {
    main { padding-top: 48px; }
    .tomate { width: 250px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tomate { animation: none; }
    .boton { transition: none; }
  }
</style>
</head>

      <span class="nombre">Facebook</span>
